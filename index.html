  <script>
    // Get current date
    const today = new Date();

    // Format the date (e.g., "October 5, 2026")
    const formattedDate = today.toLocaleDateString('en-UK', {
      day: 'numeric',
	  month: 'long',
	  year: 'numeric'
    });

    // Insert the formatted date into the HTML element
    document.getElementById('current-date').textContent = formattedDate;
  </script>
